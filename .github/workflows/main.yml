name: Build Android APK - Native

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System & Buildozer Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential ccache git libstdc++6:i386 zlib1g:i386 \
          libncurses6 libstdc++6 zlib1g openjdk-17-jdk unzip libffi-dev libssl-dev \
          autoconf libtool pkg-config zlib1g-dev libncurses-dev libsdl2-dev
        python -m pip install --upgrade pip
        pip install Pillow cython buildozer

    - name: Generate Game Icon
      run: |
        python generate_icon.py

    - name: Pre-accept Android SDK Licenses
      run: |
        # एंड्रॉइड एसडीके के लिए लाइसेंस फोल्डर बनाकर पहले से ही एक्सेप्टेड लाइसेंस की हैश फाइलें डाल देना
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p $SDK_DIR/licenses
        # Android SDK license hashes (standard accepted hashes)
        echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK_DIR/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a648b0" >> $SDK_DIR/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > $SDK_DIR/licenses/android-sdk-preview-license

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
