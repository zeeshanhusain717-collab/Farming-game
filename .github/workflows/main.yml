name: Build Android APK - Native

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System & Buildozer Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential ccache git libncurses5:i386 libstdc++6:i386 zlib1g:i386 \
          libncurses5 libstdc++6 zlib1g openjdk-17-jdk unzip libffi-dev libssl-dev \
          autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev
        python -m pip install --upgrade pip
        pip install Pillow cython buildozer

    - name: Generate Game Icon
      run: |
        python generate_icon.py

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
