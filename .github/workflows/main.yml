name: Build Android APK - Native

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Verify required files
      run: |
        for f in main.py audio.py buildozer.spec generate_icon.py; do
          if [ ! -f "$f" ]; then
            echo "::error::$f nahi mili, repo mein commit karein"
            exit 1
          fi
        done

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential ccache git unzip zip \
          libstdc++6:i386 zlib1g:i386 \
          libncurses6 libstdc++6 zlib1g zlib1g-dev libncurses-dev \
          libffi-dev libssl-dev autoconf libtool pkg-config \
          libsdl2-dev

    - name: Install Python Build Tools
      run: |
        python -m pip install --upgrade pip
        pip install "buildozer==1.5.0" "cython==0.29.36" Pillow

    - name: Generate Game Icon
      run: |
        if [ -f generate_icon.py ]; then
          python generate_icon.py
        fi

    - name: Clean old buildozer state
      run: |
        rm -rf .buildozer bin

    - name: Cache Buildozer Directory
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
        key: buildozer-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

    - name: Build APK with Buildozer
      run: |
        set -o pipefail
        buildozer -v android debug 2>&1 | tee build_log.txt

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_log.txt
        if-no-files-found: warn

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: farm7-apk
        path: bin/*.apk
        if-no-files-found: error
