name: Build Android APK - Multi-Fallback

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies for Icon
      run: |
        python -m pip install --upgrade pip
        pip install Pillow

    - name: Generate Game Icon
      run: |
        python generate_icon.py

    # पहला प्रयास: ArtemSBulgakov master वर्ज़न के साथ
    - name: Build with Buildozer (Attempt 1 - Master)
      id: build_v1
      continue-on-error: true
      uses: ArtemSBulgakov/buildozer-action@v1
      with:
        command: buildozer -v android debug
        buildozer_version: master

    # दूसरा प्रयास: अगर पहला फेल हो, तो स्थिर (stable) वर्ज़न के साथ कोशिश करें
    - name: Build with Buildozer (Attempt 2 - Stable Fallback)
      if: steps.build_v1.outcome == 'failure'
      id: build_v2
      continue-on-error: true
      uses: ArtemSBulgakov/buildozer-action@v1
      with:
        command: buildozer -v android debug
        buildozer_version: v1.0.0

    # तीसरा प्रयास: यदि दोनों फेल हों, तो सीधे pip से buildozer इंस्टॉल करके लोकल कमांड चलाना
    - name: Build with Direct Pip Buildozer (Attempt 3 - Ultimate Fallback)
      if: steps.build_v1.outcome == 'failure' && steps.build_v2.outcome == 'failure'
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev
        pip install --upgrade buildozer cython
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk

